packages:
  - "apps/*"
  - "packages/*"

# Effect 4 / Alchemy betas that pnpm's release-age check would otherwise hold back.
minimumReleaseAgeExclude:
  - effect@4.0.0
  - effect@4.0.5
  - "@effect/platform-node@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node-shared@4.0.5"
  - "@effect/vitest@4.0.0"
  - alchemy@2.0.0-beta.83
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.83"
  - "@alchemy.run/floci@2.0.0-beta.83"
  - "@alchemy.run/node-utils@2.0.0-beta.83"
  - "@distilled.cloud/cloudflare@1.0.0-rc.15"
  - "@distilled.cloud/core@1.0.0-rc.15"
